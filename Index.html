<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert Money</title>
    <script src="./Scripts.js" defer></script>
    <link rel="stylesheet" href="./Style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
    <img class="logo" src="./assents/logo.gif" alt="gif-logo-convert-money" />

    <main>
        <label>
            Converter <b>DE</b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>

        <label>
            Converter <b>PARA</b>
            <select class="currency-select">
                <option value="dolar">US$ Dólar Americano</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra Esterlina</option>
                <option value="bitcoin">₿ Bitcoin</option>
            </select>
        </label>

        <label>
            Valor
            <input class="input-currency" placeholder="R$ 10.000,00" />
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="currency-box">
                <img src="./assents/Real.png" alt="logo-real-brasileiro" />
                <p class="currency"> Real </p>
                <p class="currency-value-to-convert">R$ 0,00</p>

            </div>

            <img class="arrow-img" src="./assents/Arrow.png" alt="logo-seta-conversao">

            <div class="currency-box">
                <img class="currency-img" src ="./assents/dolar.png" alt="logo-dolar-americano" />
                <p class="currency" id="currency-name"> Dólar Americano </p>
                <p class="currency-value">US$ 0.00</p>
            </div>

        </section>
    </main>

</body>

</html>
